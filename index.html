<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">TEMA</span>
          <label class="theme-switch" title="Cambiar tema claro/oscuro">
            <input type="checkbox" id="theme-toggle" />
            <span class="theme-slider">
              <span class="theme-icon theme-icon-moon">🌙</span>
              <span class="theme-icon theme-icon-sun">☀️</span>
            </span>
          </label>
        </div>

        <div class="panel-section">
          <label class="label" for="skin-select">SKIN</label>
          <select id="skin-select" class="skin-select">
            <option value="retro">Retro</option>
            <option value="neon">Neón</option>
            <option value="pastel">Pastel</option>
            <option value="pixel">Pixel art</option>
          </select>
        </div>

        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>

        <div class="panel-section">
          <button id="weather-btn" class="weather-button">🌤️ Clima</button>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="weather-modal" class="weather-modal hidden">
      <div class="weather-modal-content">
        <button id="weather-close-btn" class="weather-close-btn">✕</button>
        <div class="weather-icon">🌤️</div>
        <h2>Clima en Rionegro</h2>
        <p class="weather-location">Antioquia, Colombia</p>
        <table class="weather-table">
          <tbody>
            <tr>
              <td class="weather-label">Temperatura</td>
              <td class="weather-value" id="temp">-</td>
            </tr>
            <tr>
              <td class="weather-label">Sensación Térmica</td>
              <td class="weather-value" id="apparent">-</td>
            </tr>
            <tr>
              <td class="weather-label">Humedad Relativa</td>
              <td class="weather-value" id="humidity">-</td>
            </tr>
            <tr>
              <td class="weather-label">Velocidad del Viento</td>
              <td class="weather-value" id="wind">-</td>
            </tr>
          </tbody>
        </table>
        <p class="weather-meta">
          <span id="timezone">-</span><br>
          <span id="update-time">-</span>
        </p>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
